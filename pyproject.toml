[project]
name = "gtc-image-quality"
version = "0.1.0"
description = "Measure delivered image quality of GTC OSIRIS+ frames from the public archive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=6.1",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "photutils>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.scripts]
gtc-iq = "gtc_iq.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtc_iq"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Contains a row copied verbatim from the archive CSV, with long URLs.
"tests/test_archive_manifest.py" = ["E501"]
# The report is written in Spanish with scientific symbols (rho, minus sign).
"src/gtc_iq/report.py" = ["RUF001"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["astropy.*", "photutils.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
